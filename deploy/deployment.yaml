apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          # Secrets (Dash0 endpoint and token, OpenAI key) live in Secret
          # app-credentials, created by hand and never committed. See README.
          # optional: the app starts without it, with telemetry off.
          envFrom:
            - secretRef:
                name: app-credentials
                optional: true
          env:
            - name: TEAM_NAME
              value: "coffeecon"
            - name: ES_URL
              value: http://elasticsearch:9200
            - name: OTEL_SERVICE_NAME
              value: talkscout-backend
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            # K14: the Python SDK may leave metrics off unless this is set (Dash0 agent skills).
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            # Always sample: callers must not be able to switch tracing off.
            - name: OTEL_TRACES_SAMPLER
              value: always_on
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
