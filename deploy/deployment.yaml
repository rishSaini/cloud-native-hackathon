apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          # Secrets (Dash0 endpoint and token, OpenAI key) live in Secret
          # app-credentials, created by hand and never committed. See README.
          # optional: the app starts without it, with telemetry off.
          envFrom:
            - secretRef:
                name: app-credentials
                optional: true
          env:
            - name: TEAM_NAME
              value: "coffeecon"
            - name: ES_URL
              value: http://elasticsearch:9200
            - name: OTEL_SERVICE_NAME
              value: affinity-api
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            # K14: the Python SDK may leave metrics off unless this is set (Dash0 agent skills).
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            # Always sample: callers must not be able to switch tracing off.
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            # R3: Postgres, from the operator's Secret. optional: the app starts
            # before the database exists, and /healthz never needs it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
                  optional: true
            # K17: service identity for Dash0 (dash0hq/agent-skills, resources and k8s rules).
            # service.version is added at start from the image's APP_VERSION.
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=affinity,deployment.environment.name=cnh-2026,service.instance.id=$(K8S_POD_UID),k8s.namespace.name=team-coffeecon,k8s.pod.uid=$(K8S_POD_UID),k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME),k8s.container.name=app"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
