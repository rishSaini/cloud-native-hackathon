# One-off Job: applies the Postgres migrations (R3). Safe to rerun.
# Not in kustomization.yaml, so Argo CD never owns it (examples/agent-workflows/README.md).
# Run after Cluster db is Ready:
#   Radar MCP: apply_resource with mode=create, then wait_for kind=job condition=complete
#   or:        kubectl create -f deploy/jobs/db-migrate-001.yaml
# To run again, copy it with a new name (db-migrate-002). Never reuse a Job name.
# If ./scripts/setup.sh already ran, replace __TEAM__ and OWNER/REPO by hand.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-001
  namespace: team-__TEAM__
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/OWNER/REPO:latest
          imagePullPolicy: Always
          workingDir: /app/backend
          command: [python, -m, app.db.migrate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
