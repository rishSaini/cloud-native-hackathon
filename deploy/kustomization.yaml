# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-coffeecon
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - elasticsearch.yaml
  - rbac.yaml
  - controller.yaml
  - postgres.yaml
  - priorityclasses.yaml
images:
  - name: app
    newName: ghcr.io/rishsaini/cloud-native-hackathon
    newTag: 46cec16
