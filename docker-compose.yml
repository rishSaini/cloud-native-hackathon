# Local Elasticsearch for development.
# Security is off and ports bind to 127.0.0.1 only, so other people on the venue Wi-Fi cannot reach it.
name: talkscout

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=trial # unlocks RRF, inference and more for 30 days
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 30

  kibana:
    profiles: ["kibana"]
    image: docker.elastic.co/kibana/kibana:9.5.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
