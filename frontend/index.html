<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Affinity: find your talk, find your people.">
  <title>Affinity</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FBF7F0'/%3E%3Cg fill='%23B5482F'%3E%3Ccircle cx='6' cy='8' r='2.4'/%3E%3Ccircle cx='17' cy='6' r='2.4'/%3E%3Ccircle cx='12' cy='17' r='2.4'/%3E%3C/g%3E%3C/svg%3E">
  <!-- Dash0 website monitoring (RUM). The backend turns it on when DASH0_RUM_* are set. -->
  <script src="/rum.js"></script>
  <!-- Fonts are optional: system fonts take over if the venue Wi-Fi blocks Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking: a slow or blocked fonts request must not hold up the app. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/phone.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/cosmic.css">
  <link rel="stylesheet" href="/static/css/editorial.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app-shell">
    <header class="app-header" id="app-header">
      <a class="brand" href="#/now" aria-label="Affinity home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="6" cy="8" r="2.2"/><circle cx="17" cy="6" r="2.2"/><circle cx="12" cy="17" r="2.2"/>
          <path d="M6 8 L17 6 L12 17 Z" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/>
        </svg>
        <span>Affinity</span>
      </a>
      <span class="conn-pill" id="conn-pill" hidden role="status">Reconnecting</span>
      <button type="button" class="term-open" id="term-open" aria-haspopup="dialog" aria-label="Open kubectl terminal">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 10l3 2.5L7 15M12.5 15h4.5"/></svg>
        <span>kubectl</span>
      </button>
      <a class="settings-link" href="#/settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/></svg>
      </a>
      <div class="header-row">
        <a class="alone-pill" id="alone-pill" href="#/board" hidden><span class="alone-dot" aria-hidden="true"></span><span id="alone-text">0 alone</span></a>
        <span class="demo-badge" id="demo-badge" hidden>Demo data</span>
        <div class="mode-toggle" role="group" aria-label="Display mode">
          <button type="button" data-mode="human" aria-pressed="true">Human</button>
          <button type="button" data-mode="kubectl" aria-pressed="false">kubectl</button>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <noscript><p class="notice">Affinity needs JavaScript to run.</p></noscript>
    </main>

    <footer class="app-footer">version {{VERSION}}</footer>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/now" data-tab="now">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>
      <span>Now</span>
    </a>
    <a href="#/card" data-tab="card">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M6.5 15.5c.8-1.4 4.2-1.4 5 0M14 10h4M14 13.5h3"/></svg>
      <span>Card</span>
    </a>
    <a href="#/group" data-tab="group">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="7" cy="9" r="2.3"/><circle cx="17" cy="9" r="2.3"/><circle cx="12" cy="15.5" r="2.3"/><path d="M8.8 10.4l1.9 3.4M15.2 10.4l-1.9 3.4M9.3 9h5.4"/></svg>
      <span>Group</span>
    </a>
    <a href="#/report" data-tab="report">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 20V4.5M6 5h11l-2.5 4L17 13H6"/></svg>
      <span>Report</span>
    </a>
    <a href="#/met" data-tab="met">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5l2.4 5 5.4.6-4 3.7 1.1 5.3L12 15.5l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"/></svg>
      <span>Met</span>
    </a>
  </nav>

  <!-- Polite announcements for screen readers. Written only through a11y.announce(). -->
  <div class="visually-hidden" id="live-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
