<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TalkScout</title>
  <!-- Dash0 website monitoring (RUM). The backend turns it on when DASH0_RUM_* are set. -->
  <script src="/rum.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 720px; margin: 2rem auto; padding: 0 16px; }
    form { display: flex; gap: 0.5rem; }
    input { flex: 1; padding: 0.6rem; font-size: 1rem; }
    button { padding: 0.6rem 1rem; font-size: 1rem; }
    ul { padding: 0; }
    li { margin: 1rem 0; list-style: none; }
    .meta { opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>TalkScout</h1>
  <form id="search-form">
    <input id="q" placeholder="What do you want to learn about?" autofocus>
    <button>Search</button>
  </form>
  <p id="status" class="meta"></p>
  <ul id="results"></ul>
  <footer class="meta">version {{VERSION}}</footer>

  <script>
    const $ = (id) => document.getElementById(id);

    function renderHit(hit) {
      const li = document.createElement("li");
      const title = document.createElement("strong");
      title.textContent = hit.title || hit.id;
      const body = document.createElement("div");
      body.className = "meta";
      body.textContent = hit.abstract || "";
      li.append(title, body);
      return li;
    }

    $("search-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const q = $("q").value.trim();
      if (!q) return;
      $("status").textContent = "Searching...";
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        $("status").textContent = data.note || `${data.total} results`;
        $("results").replaceChildren(...data.hits.map(renderHit));
      } catch (err) {
        $("status").textContent = `Search failed: ${err.message}`;
      }
    });
  </script>
</body>
</html>
